<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio de Álgebra Lineal</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="contenedor">

        <aside class="sidebar">
            <h2>Álgebra Lineal</h2>

            <div class="menu-item">

                <div class="submenu">
                    <button class="ejercicio-btn" data-ejercicio="sis1">1.1 Método de Gauss-Jordan</button>
                </div>
            </div>

            <div class="menu-item">
                <button class="menu-btn">2. Matriz Inversa</button>

        <!-- Área de visualización del ejercicio -->
        <main class="contenido-principal">
            <section id="area-ejercicio" class="tarjeta-ejercicio bienvenida">
